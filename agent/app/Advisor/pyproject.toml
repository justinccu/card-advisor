[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Advisor"
version = "0.1.0"
description = "Card Advisor: the conversational Advisor on AgentCore Runtime (ADR 0009)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "httpx >= 0.27",
    "pyjwt >= 2.9",
    "strands-agents >= 1.15.0",
]

[dependency-groups]
dev = ["pytest >= 8"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
