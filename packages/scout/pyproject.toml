[project]
name = "scout"
version = "0.1.0"
description = "Scout: fetches Issuer pages and extracts Proposed Changes for human review (ADR 0002, 0007)"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "boto3>=1.35",
    "card-rules",
    "httpx>=0.27",
    "lxml>=5",
    "playwright>=1.47",
    "pydantic>=2.8",
    "pyyaml>=6",
]

[tool.uv.sources]
card-rules = { workspace = true }

[project.scripts]
scout = "scout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]
