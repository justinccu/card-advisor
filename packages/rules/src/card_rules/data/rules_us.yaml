  basis: held
  lookback_months: null
  description: "Amex: may not get the Blue Cash Everyday welcome offer if you have or have had the Blue Cash Preferred Card"
  applies_to_products: all
  strength: strict
  confidence: official
  source_url: https://www.americanexpress.com/us/credit-cards/card/blue-cash-everyday/
  verified_on: 2026-09-27

- kind: offer_history
