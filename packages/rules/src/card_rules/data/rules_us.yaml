# US Eligibility Rules. Every rule needs a source_url and verified_on.
# strength: strict = enforced consistently -> Ineligible; soft = inconsistently enforced -> warning only.
# confidence: official = in issuer terms; community = inferred from applicant data points.
# When unsure, prefer soft: a false "Ineligible" hides a card the user could have gotten.

# --- Chase ---------------------------------------------------------------------
- kind: velocity
  id: chase_5_24
  issuer_id: chase
  description: "Chase 5/24: denied with 5+ new personal cards from any issuer in 24 months"
  scope: all_issuers
  limit: 5
  window_months: 24
  counts_authorized_user: true
  counts_business: false
  applies_to_products: all
  strength: strict
  confidence: community
  source_url: https://frequentmiler.com/complete-guide-to-credit-card-application-rules-by-bank/
  verified_on: 2026-09-24

