# Retired 2026-10-01 (owner review): chase_sapphire_open, "no bonus while another personal
# Sapphire card is open". Chase dropped it on 2026-01-22, after dropping the 48-month rule and
# the one-Sapphire limit in June 2025. The Preferred's and the Reserve's bonuses now count
# separately: both cards can be held, and each bonus earned once.

- kind: offer_history
  id: chase_sapphire_once_per_card
  issuer_id: chase
  family: sapphire
  target: product
  basis: held
  lookback_months: null
  description: "Chase Sapphire (since 2026-01-22): each Sapphire card's bonus once per lifetime; holding another Sapphire doesn't matter"
  strength: strict
  confidence: official
  source_url: https://www.thepointsguy.com/news/chase-sapphire-bonus-eligibility-changes-2026/
  verified_on: 2026-10-01

- kind: offer_history
