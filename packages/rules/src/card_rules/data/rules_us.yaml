# Amex product-family ladders (ADR 0009), from each card's offer terms as copied verbatim in
# catalog/seed/amex_offer_terms.yaml. Only the catalog cards each sentence names besides the card
# itself (the card itself is amex_once_per_lifetime). One-directional: holding Gold does not
# block the Platinum Offer.
- kind: offer_history
  id: amex_ladder_gold
  issuer_id: amex
  target: products
  for_product: amex_gold
  products: [amex_platinum]
  basis: held
  lookback_months: null
  description: "Amex: may not get the Gold Card welcome offer if you have or have had the Platinum Card"
  applies_to_products: all
  strength: strict
  confidence: official
  source_url: https://www.americanexpress.com/us/credit-cards/card/gold-card/
  verified_on: 2026-09-27

