[project]
name = "card-rules"
version = "0.1.0"
description = "Deterministic eligibility engine shared by the web API, Gateway tools, and CI evals"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/card_rules"]
