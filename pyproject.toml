[project]
name = "card-advisor"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["card-rules"]

[tool.uv.sources]
card-rules = { workspace = true }

[tool.uv.workspace]
members = ["infra", "packages/rules", "packages/scout", "packages/api"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "moto[dynamodb]>=5",
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["infra/tests", "packages/rules/tests", "packages/scout/tests", "packages/api/tests"]
pythonpath = ["infra"]
# Build output holds third-party packages (some ship their own test files); never collect it.
norecursedirs = ["cdk.out", "build", "node_modules", ".venv", ".*"]

[tool.ruff.lint.per-file-ignores]
"packages/scout/src/scout/report.py" = ["E501"]  # embedded CSS
