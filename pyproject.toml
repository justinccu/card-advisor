[project]
name = "card-advisor"
version = "0.1.0"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["infra"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["infra/tests"]
pythonpath = ["infra"]
