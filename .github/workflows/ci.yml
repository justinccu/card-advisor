name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g aws-cdk
      - run: uv sync --all-packages
      - run: uv run pre-commit run --all-files
      - run: uv run pytest
      - name: Lambda bundle (Linux arm64 wheels, no Docker)
        run: ./scripts/bundle_lambda.sh
      - name: cdk synth
        working-directory: infra
        run: cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          ALERT_EMAIL: ci@example.invalid

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Builds every page from the newest committed Catalog Snapshot (catalog/us/vMAJOR.MINOR.json)
      - run: npm run build
